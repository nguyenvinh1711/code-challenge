name: problem5

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/problem5

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm run solution5:test
      - name: Build
        run: npm run solution5:build

  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: problem5/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: items
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d items"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Run migrations
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://app:app@localhost:5432/items \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            node dist/problem5/src/scripts/migrate.js
      - name: Start app
        run: |
          docker run -d --name app --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DB_DRIVER=postgres \
            -e DATABASE_URL=postgres://app:app@localhost:5432/items \
            -e CACHE_DRIVER=redis \
            -e REDIS_URL=redis://localhost:6379 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Wait for /health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          echo "Healthcheck never passed"
          docker logs app
          exit 1
      - name: Smoke CRUD
        run: |
          curl -fsS -X POST http://localhost:3000/items \
            -H 'content-type: application/json' \
            -d '{"name":"smoke"}' | tee /tmp/created.json
          total=$(curl -fsS http://localhost:3000/items | python3 -c 'import json,sys;print(json.load(sys.stdin)["total"])')
          test "$total" -ge 1
      - name: Dump app logs on failure
        if: failure()
        run: docker logs app || true
